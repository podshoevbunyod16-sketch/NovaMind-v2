[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".venv", ".git", "node_modules", "__pycache__", ".pytest_cache",
  "examples", "migrations", "tests/frontend", "generated_media",
  "routes/react_agent.py.conflict",
]

[tool.ruff.lint]
# Quality gate focuses on real bugs and risky constructs.  The legacy code base
# has hundreds of stylistic differences; those are tracked in the final audit
# rather than silently reformatted in a security patch.
select = ["E9", "F63", "F7", "F82", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "observability.py", "web_hardening.py", "auth.py", "provider_policy.py",
  "db_config.py", "jobs.py", "upload_security.py", "scripts/scan_secrets.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "examples/*", "migrations/*", "evals/*",
        "routes/react_agent.py.conflict", ".venv/*", "node_modules/*"]
