# ══════════════════════════════════════════════════════════════════
# NovaMind · logrotate
# ──────────────────────────────────────────────────────────────────
# В systemd-режиме логи идут в journald (journalctl -u novamind).
# Этот файл нужен, если приложение дополнительно пишет nova.log
# (NOVA_LOG_FILE) или вы перенаправляете вывод service в файл.
#
# Установка:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/novamind
#   sudo logrotate -d /etc/logrotate.d/novamind    # проверка
# ══════════════════════════════════════════════════════════════════
/opt/novamind/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su novamind novamind
}
