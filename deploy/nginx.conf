# ══════════════════════════════════════════════════════════════════
# NovaMind · nginx (шаблон reverse proxy)
# ──────────────────────────────────────────────────────────────────
# Приложение слушает 127.0.0.1:5000 (см. app.py / server.py), наружу
# смотрит только nginx с TLS. После правки:
#   sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name novamind.example.com;
    # Оставьте только редирект на HTTPS, если сертификат уже есть.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name novamind.example.com;

    ssl_certificate     /etc/letsencrypt/live/novamind.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novamind.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Медиа/файлы проекта: тот же лимит, что MAX_CONTENT_LENGTH в app.py.
    client_max_body_size 500m;

    # Безопасность: приложение не должно отдавать себя в чужой iframe.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Критично для чата и агента: NDJSON-стримы нельзя буферизовать,
        # иначе ответ «зависает» до конца генерации.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Статика отдаётся напрямую и кешируется браузером.
    location /static/ {
        alias /opt/novamind/static/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
